{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;">
  <div style="width:100%;max-width:480px;">
    <div style="text-align:center;margin-bottom:32px;">
      <a href="{{ url_for('public.index') }}" style="font-size:32px;font-weight:800;">
        <span style="color:var(--green);">Waste</span><span style="color:var(--amber);">Bank</span>
      </a>
      <div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:4px;">CRÉER UN COMPTE GRATUIT</div>
    </div>

    <div class="card">
      <div class="card-header" style="justify-content:center;">
        <span class="card-title" style="font-size:18px;">♻️ Rejoindre WasteBank</span>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="form-group"><label>Nom complet</label><input type="text" name="name" required autofocus placeholder="Moussa Diallo"></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="vous@email.com"></div>
          <div class="form-group"><label>Téléphone mobile money</label><input type="tel" name="phone" required placeholder="+221 77 000 00 00"></div>
          <div class="form-group">
            <label>Ville</label>
            <select name="city">
              {% for c in ['Dakar','Thiès','Saint-Louis','Ziguinchor','Abidjan','Cotonou','Lomé','Bamako'] %}
              <option>{{ c }}</option>{% endfor %}
            </select>
          </div>
          <div class="form-group"><label>Mot de passe</label><input type="password" name="password" required placeholder="Minimum 6 caractères"></div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">
            ✓ Créer mon compte
          </button>
        </form>
        <div style="text-align:center;margin-top:16px;">
          <p style="font-size:13px;color:var(--muted);">Déjà inscrit ?
            <a href="{{ url_for('auth.login') }}" style="color:var(--green);font-weight:700;">Se connecter</a>
          </p>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--muted);">
      En créant un compte, vous acceptez que vos déchets contribuent à un Dakar plus propre 🌱
    </div>
  </div>
</div>
{% endblock %}
