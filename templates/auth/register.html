{% extends "base.html" %}
{% block title %}Inscription — WasteBank{% endblock %}
{% block body %}
<div style="min-height:100vh;background:var(--obsidian);display:flex;flex-direction:column;">
  <div style="height:54px;background:var(--void);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 36px;">
    <a href="{{ url_for('public.index') }}" style="display:flex;align-items:center;gap:9px;text-decoration:none;">
      <div style="width:30px;height:30px;background:linear-gradient(135deg,var(--copper-dk),var(--copper));border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:15px;">♻</div>
      <span style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--ivory);">WasteBank</span>
    </a>
    <div style="margin-left:auto;"><a href="{{ url_for('auth.login') }}" class="btn btn-dim btn-sm">Connexion</a></div>
  </div>
  <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;">
    <div style="width:100%;max-width:500px;">
      <div style="margin-bottom:28px;">
        <div style="display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);padding:4px 12px;border-radius:2px;margin-bottom:14px;">
          <span style="width:5px;height:5px;background:var(--copper);border-radius:50%;display:inline-block;"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--muted);letter-spacing:2px;">INSCRIPTION GRATUITE</span>
        </div>
        <h1 style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--ivory);margin-bottom:6px;">Rejoindre WasteBank</h1>
        <p style="color:var(--muted);font-size:13px;">Commencez à transformer vos déchets en revenus.</p>
      </div>
      <div class="card">
        <div class="card-body">
          <form method="POST">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="fg"><label>Nom complet</label><input type="text" name="name" required placeholder="Moussa Diallo"></div>
              <div class="fg"><label>Ville</label>
                <select name="city">{% for c in ['Dakar','Thiès','Saint-Louis','Ziguinchor','Abidjan','Cotonou','Lomé','Bamako'] %}<option>{{c}}</option>{% endfor %}</select>
              </div>
            </div>
            <div class="fg"><label>Email</label><input type="email" name="email" required placeholder="vous@email.com"></div>
            <div class="fg"><label>Téléphone (mobile money)</label><input type="tel" name="phone" required placeholder="+221 77 000 00 00"></div>
            <div class="fg"><label>Mot de passe</label><input type="password" name="password" required placeholder="Minimum 6 caractères"></div>
            <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;">
              <input type="checkbox" name="agree" required style="width:auto;margin-top:3px;accent-color:var(--copper);">
              <label style="font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;margin:0;">
                J'accepte les <a href="#" style="color:var(--copper-lt);">conditions d'utilisation</a> et la <a href="#" style="color:var(--copper-lt);">politique de confidentialité</a>.
              </label>
            </div>
            <button type="submit" class="btn btn-copper btn-lg" style="width:100%;justify-content:center;">Créer mon compte</button>
          </form>
        </div>
      </div>
      <p style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);">Déjà inscrit ? <a href="{{ url_for('auth.login') }}" style="color:var(--copper-lt);font-weight:600;">Se connecter</a></p>
    </div>
  </div>
</div>
{% endblock %}
