<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}WasteBank{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/main.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%23C87941'/><text y='23' x='5' font-size='18' fill='%230C0C0E'>♻</text></svg>">
{% block head %}{% endblock %}
</head>
<body>
<div class="flashes" id="fl">
  {% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}
  <div class="flash {{c}}" onclick="this.remove()">
    <span>{% if c=='success'%}✓{% elif c=='error'%}✕{% elif c=='warning'%}!{% else %}i{% endif %}</span>
    <span>{{msg}}</span>
  </div>
  {% endfor %}{% endwith %}
</div>
{% block body %}{% endblock %}
<script>
  setTimeout(()=>{document.querySelectorAll('.flash').forEach(f=>{
    f.style.transition='opacity .35s';f.style.opacity='0';
    setTimeout(()=>f.remove(),350);
  });},4000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
